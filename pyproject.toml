[project]
name = "brain-import-starter"
version = "0.2.0"
description = "Small, adaptable source imports through the Alludium Brain CLI"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
]

[project.scripts]
brain-import = "brain_import.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_import"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build]
artifacts = ["src/brain_import/web/**"]
